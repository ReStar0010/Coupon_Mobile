  if (g<=1) return {glow:true,lightning:0,particles:0, vignette:0,   vibrate:false,intensity:0.18};

// ── Onboarding overlay ─────────────────────────────────────────────────────────
const OnboardingOverlay = ({screenKey, step, onNext, onDone}) => {
  const steps = ONBOARDING[screenKey] || [];
  if (!steps.length || step >= steps.length) return null;
  const isLast = step === steps.length - 1;
  const current = steps[step];
  const text = typeof current === 'string' ? current : current.text;
  const spot = typeof current === 'object' && current.spot ? current.spot : null;

  // Position tooltip above spotlight if in bottom half, otherwise below
  const above = spot && spot.top > 440;
  const tooltipPos = above
    ? { bottom: Math.max(90, 844 - spot.top + 10) }
    : { top: spot ? Math.min(spot.top + spot.height + 14, 650) : 200 };

  return (
    <div style={{position:'absolute',inset:0,zIndex:200,pointerEvents:'all'}} onClick={isLast?onDone:onNext}>
      {spot ? (
        // Spotlight: transparent hole punched through a 9999px box-shadow overlay
        <div style={{
          position:'absolute', top:spot.top, left:spot.left,
          width:spot.width, height:spot.height,
          boxShadow:`0 0 0 9999px rgba(0,0,0,0.72)`,
          borderRadius:spot.radius||8,
          border:`2px solid ${C.yellow}`,
          zIndex:201, pointerEvents:'none',
        }}/>
      ) : (
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.72)',zIndex:201,pointerEvents:'none'}}/>
      )}
      <div onClick={e=>e.stopPropagation()} style={{
        position:'absolute', left:16, right:16, ...tooltipPos,
        background:C.fg, border:`3px solid ${C.yellow}`,
        boxShadow:`6px 6px 0 ${C.yellow}`,
        borderRadius:8, padding:'18px 16px',
        animation:'nbModalIn 0.25s ease-out', zIndex:202,
      }}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div style={{display:'flex',gap:4}}>
            {steps.map((_,i)=>(
              <div key={i} style={{width:i===step?18:6,height:6,borderRadius:3,
                background:i<=step?C.yellow:'rgba(255,255,255,0.2)',transition:'width 0.2s'}}/>
            ))}
          </div>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:'rgba(255,255,255,0.4)'}}>
            {step+1}/{steps.length}
          </div>
        </div>
        <div style={{fontWeight:700,fontSize:15,color:'#fff',lineHeight:1.55}}>{text}</div>
        <button onClick={isLast?onDone:onNext} style={{marginTop:14,width:'100%',padding:'11px',
          background:C.yellow,border:`2px solid ${C.border}`,boxShadow:`3px 3px 0 ${C.border}`,
          borderRadius:4,fontWeight:800,fontSize:13,color:C.fg,cursor:'pointer'}}>
          {isLast?'開始使用！':'下一步 →'}
        </button>
      </div>
    </div>
  );
};

// ── Draw Modal ─────────────────────────────────────────────────────────────────
const DrawModal = ({onDraw, onClose}) => {
  const [drawing, setDrawing] = React.useState(false);
  const [result,  setResult]  = React.useState(null);

  const doDraw = () => {
    setDrawing(true);
    setTimeout(()=>{
      let r=Math.random(), acc=0, picked=COUPON_POOL[COUPON_POOL.length-1];
      for (const c of COUPON_POOL) { acc+=c.prob; if(r<acc){picked=c;break;} }
      setResult(picked);
      setDrawing(false);
    }, 1400);
  };

  return (
    <div style={{position:'absolute',inset:0,zIndex:150,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.5)'}} onClick={!drawing&&!result?onClose:undefined}/>
      <div style={{position:'relative',background:C.bg,borderRadius:'16px 16px 0 0',
        border:`3px solid ${C.border}`,borderBottom:'none',padding:'20px 16px 32px',
        animation:'nbModalIn 0.28s ease-out',boxShadow:`0 -6px 0 ${C.yellow}`}}>
        <div style={{width:40,height:5,background:C.border,borderRadius:2,margin:'0 auto 16px'}}/>
        {!result ? (
          <>
            <div style={{fontWeight:800,fontSize:18,marginBottom:4}}>抽券</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:20}}>每次抽券消耗 <b>20 pt</b> · 機率如下</div>
            <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:20}}>
              {COUPON_POOL.map((c,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',
                  background:C.card,border:`2px solid ${C.border}`,boxShadow:sh(1),borderRadius:5}}>
                  <div style={{width:36,fontFamily:"'JetBrains Mono',monospace",fontWeight:800,fontSize:13,color:c.amount?C.fg:C.muted}}>
                    {c.amount?`$${c.amount}`:'空'}
                  </div>
                  <div style={{flex:1,fontSize:12,color:c.amount?C.fg:C.muted}}>{c.amount?c.store:'沒抽到'}</div>
                  <div style={{width:48,height:8,background:C.subtle,borderRadius:2,overflow:'hidden'}}>
                    <div style={{width:`${c.prob*100}%`,height:'100%',background:c.amount?C.yellow:C.subtle}}/>
                  </div>
                  <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.muted,width:30,textAlign:'right'}}>
                    {Math.round(c.prob*100)}%
                  </div>
                </div>
              ))}
            </div>
            <button onClick={doDraw} disabled={drawing} style={{
              width:'100%',padding:'15px',
              background:drawing?C.subtle:C.yellow,
              border:`2.5px solid ${drawing?C.subtle:C.border}`,
              boxShadow:drawing?'none':sh(3),borderRadius:6,
              fontWeight:800,fontSize:16,color:drawing?C.muted:C.fg,cursor:drawing?'wait':'pointer',
              display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
              {drawing?(
                <svg width="20" height="20" viewBox="0 0 24 24" style={{animation:'nbDrawSpin 0.9s linear infinite'}}>
                  <circle cx="12" cy="12" r="9" fill="none" stroke={C.muted} strokeWidth="2.5" strokeDasharray="30 10"/>
                </svg>
              ):null}
              {drawing?'抽券中…':'立即抽券 (−20 pt)'}
            </button>
          </>
        ) : (
          <>
            {result.amount>0 ? (
              <>
                <div style={{textAlign:'center',marginBottom:12}}>
                  <div style={{width:64,height:64,background:C.yellow,border:`3px solid ${C.border}`,
                    boxShadow:sh(4),borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',
                    margin:'0 auto 10px',animation:'nbSuccessPop 0.5s cubic-bezier(.34,1.56,.64,1)'}}>

                  <div style={{fontWeight:800,fontSize:20,color:C.fg}}>抽中了！</div>
                  <div style={{fontSize:12,color:C.muted,marginTop:4}}>{result.store}</div>
                </div>
                <div style={{background:C.yellow,border:`2.5px solid ${C.border}`,boxShadow:sh(3),
                  borderRadius:8,padding:'16px',textAlign:'center',marginBottom:16}}>
                  <div style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:900,fontSize:36,color:C.fg}}>${result.amount}</div>
                  <div style={{fontSize:12,color:C.fg,marginTop:2}}>{result.detail} · 到期 {result.expires}</div>
                </div>

            ) : (
              <div style={{textAlign:'center',padding:'24px 0',marginBottom:16}}>
                <div style={{fontSize:48,marginBottom:10}}>😔</div>

const AnimNum = ({value}) => {
  const [shown,setShown] = React.useState(value);
  const [pop,setPop]     = React.useState(false);
  React.useEffect(()=>{
    if (shown===value) return;
    setPop(true);
    const step = value>shown?1:-1;
    const id = setInterval(()=>{setShown(s=>{if(s===value){clearInterval(id);return s;}return s+step;});},40);
    const t = setTimeout(()=>setPop(false),350);
    return ()=>{clearInterval(id);clearTimeout(t);};
  },[value]);
  return <span style={{display:'inline-block',transform:pop?'scale(1.18)':'scale(1)',transition:'transform 0.18s'}}>{shown}</span>;
};

// ── Wheel Dial (new) ──────────────────────────────────────────────────────────
const WheelDial = ({size=260, floor=0, spin=0, spinning=false, gems=1}) => {
  const r=size/2-18, cx=size/2, cy=size/2;
  const available = MULTS.filter(m=>m.v>=floor);
  const weights   = available.map(m=>1/(m.v+1));
  const total     = weights.reduce((a,b)=>a+b,0);
  let acc=-Math.PI/2;
  const ranges=available.map((m,i)=>{
    const w=weights[i]/total*Math.PI*2; const a0=acc; acc+=w; return {a0,a1:acc,...m};
  });
  const arc=(a0,a1)=>{
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    return `M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}Z`;
  };
  const lp=(a0,a1)=>{const a=(a0+a1)/2,d=r*0.63;return[cx+d*Math.cos(a),cy+d*Math.sin(a),(a*180/Math.PI)+90];};
  const rimCol=gems>=5?C.purple:gems>=4?'#FF6135':gems>=3?'#CC8800':gems>=2?C.yellow:'#444444';
  const rimW=gems>=4?6:gems>=2?4:3;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}
      style={{display:'block',overflow:'visible',
        filter:gems>=3?`drop-shadow(0 0 ${gems*4}px ${rimCol}88)`:'drop-shadow(4px 4px 0 #333)'}}>
      {/* Hard offset shadow */}
      <circle cx={cx+8} cy={cy+8} r={r+14} fill="#333"/>
      {/* Outer rim */}
      <circle cx={cx} cy={cy} r={r+14} fill="#1a1a1a" stroke={rimCol} strokeWidth={rimW}/>
      {/* Rim notch marks */}
      {Array.from({length:24},(_,i)=>{
        const a=(i/24)*Math.PI*2, notchR=r+8, notchL=i%4===0?10:5;
        const x0=cx+(notchR)*Math.cos(a), y0=cy+(notchR)*Math.sin(a);
        const x1=cx+(notchR-notchL)*Math.cos(a), y1=cy+(notchR-notchL)*Math.sin(a);
        return <line key={i} x1={x0} y1={y0} x2={x1} y2={y1}
          stroke={i%4===0?C.yellow:'rgba(255,255,255,0.25)'} strokeWidth={i%4===0?2.5:1}/>;
      })}
      {/* Spinning sectors */}
      <g style={{transform:`rotate(${spin}deg)`,transformOrigin:`${cx}px ${cy}px`,
        transition:spinning?`transform 4.2s cubic-bezier(0.12,0,0.04,1)`:'none'}}>
        {ranges.map((sec,i)=>{
          const [lx,ly,aDeg]=lp(sec.a0,sec.a1);
          return (
            <g key={i}>
              <path d={arc(sec.a0,sec.a1)} fill={sec.color} stroke="#333" strokeWidth="4"/>
              <line x1={cx} y1={cy} x2={cx+(r+14)*Math.cos(sec.a0)} y2={cy+(r+14)*Math.sin(sec.a0)} stroke="#333" strokeWidth="4"/>
              <text x={lx} y={ly+5} textAnchor="middle" transform={`rotate(${aDeg} ${lx} ${ly})`}
                fontFamily="JetBrains Mono,monospace" fontSize="15" fontWeight="900"
                fill="#fff" stroke="#333" strokeWidth="3" paintOrder="stroke">{sec.label}</text>
            </g>
          );
        })}
      </g>
      {/* Hub */}
      <rect x={cx-15} y={cy-15} width={30} height={30} fill={C.yellow} stroke="#333" strokeWidth="3" rx={2}/>
      <rect x={cx-9}  y={cy-9}  width={18} height={18} fill="#333"/>
      <rect x={cx-5}  y={cy-5}  width={10} height={10} fill={C.yellow}/>
      {/* Needle — bold arrow at top */}
      <polygon points={`${cx-12},${cy-r-3} ${cx+12},${cy-r-3} ${cx},${cy-r+12}`}
        fill={C.yellow} stroke="#333" strokeWidth="3.5" strokeLinejoin="round"/>
      <polygon points={`${cx-7},${cy-r-20} ${cx+7},${cy-r-20} ${cx},${cy-r-4}`}
        fill="#fff" stroke="#333" strokeWidth="2.5" strokeLinejoin="round"/>
    </svg>
  );
};

// ── Spinner Screen ─────────────────────────────────────────────────────────────
const SpinnerScreen = ({nav, gems, setGems, couPoints, setCouPoints}) => {
  const [players,       setPlayers]      = React.useState(1);
  const [filledGuests,  setFilledGuests] = React.useState(0);
  const [spin,          setSpin]         = React.useState(0);
  const [spinning,      setSpinning]     = React.useState(false);
  const [result,        setResult]       = React.useState(null);
  const [nearMiss,      setNearMiss]     = React.useState(false);
  const [flash,         setFlash]        = React.useState(null);
  const [shake,         setShake]        = React.useState(null);
  const [gemShake,      setGemShake]     = React.useState(false);
  const prevGemsRef = React.useRef(gems);
  const [obStep,        setObStep]       = React.useState(0);
  const [obActive,      setObActive]     = React.useState(true);

  React.useEffect(() => {
    if (gems > prevGemsRef.current) {
      setGemShake(true);
      const dur = 200 + gems * 60;
      setTimeout(() => setGemShake(false), dur);
    }
    prevGemsRef.current = gems;
  }, [gems]);

  const floor     = getFloor(gems, players);
  const invited   = players - 1;
  const allFilled = filledGuests >= invited;

  React.useEffect(()=>{ setFilledGuests(0); }, [players]);

  const handleSpin = () => {
    if (spinning || !allFilled) return;
    setSpinning(true); setResult(null); setFlash(null); setNearMiss(false);
    const available = MULTS.filter(m=>m.v>=floor);
    const weights   = available.map(m=>1/(m.v+1));
    const total     = weights.reduce((a,b)=>a+b,0);
    let pick=Math.random()*total, chosen=available[0];
    for (let i=0;i<available.length;i++){pick-=weights[i];if(pick<=0){chosen=available[i];break;}}
    let acc=0, centerDeg=0;
    for (let i=0;i<available.length;i++){
      const w=(weights[i]/total)*360;
      if(available[i].v===chosen.v){centerDeg=acc+w/2;break;}
      acc+=w;
    }
    const target = 360*8 - centerDeg + (Math.random()*8-4);
    setSpin(s=>s+target);
    setTimeout(()=>{
      const hasX5=available.some(m=>m.v===5);
      if(hasX5 && chosen.v!==5 && Math.random()<0.35){
        setNearMiss(true);
        setTimeout(()=>setNearMiss(false), 400);
      }
    }, 3400);
    setTimeout(()=>{
      setSpinning(false);
      setTimeout(()=>{
        const pts = gems * chosen.v;
        setResult({mult:chosen.v, points:pts, color:chosen.color});
        if(chosen.v===5){ setFlash('x5'); }
        else if(chosen.v===0){ setFlash('x0'); }
        const shakeLevel = chosen.v<=1?null:chosen.v===2?'sm':chosen.v===3?'md':chosen.v===4?'lg':'xl';
        if(shakeLevel){ setShake(shakeLevel); setTimeout(()=>setShake(null), chosen.v>=5?900:600); }
        setTimeout(()=>setCouPoints(p=>p+pts), 600);
        setTimeout(()=>setFlash(null), 1600);
      }, 350);
    }, 4800);
  };

  const slotType = i => i===0?'me':i<=filledGuests?'guest':'empty';

  return (
    <div style={{flex:1,position:'relative',overflow:'hidden',display:'flex',flexDirection:'column',
      background:C.bg,color:C.fg,
      animation:gemShake?`nbGemLoad ${200+gems*60}ms ease-out both`:shake?`nbShake${shake.charAt(0).toUpperCase()+shake.slice(1)} ${shake==='xl'?'0.9s':'0.6s'} cubic-bezier(0.36,0.07,0.19,0.97) both`:spinning?'nbShakeXs 0.22s ease-in-out infinite':'none',
      transformOrigin:'center center'}}>
      {nearMiss && (
        <div style={{position:'absolute',inset:0,zIndex:18,pointerEvents:'none',
          background:'rgba(107,79,255,0.4)',animation:'nbFlash 0.4s ease-out'}}/>
      )}

      {/* Header */}
      <StatusBar/>
      <div style={{padding:'4px 18px 8px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{fontWeight:800,fontSize:20,letterSpacing:'-0.03em',color:C.fg}}>抽獎桌</div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <HelpBtn onClick={()=>{setObStep(0);setObActive(true);}}/>
          <div style={{display:'flex',alignItems:'center',gap:5,padding:'5px 10px',
            background:C.card,border:`2px solid ${C.border}`,boxShadow:`2px 2px 0 ${C.border}`,borderRadius:4}}>
            <CoinIcon size={14}/>
            <span style={{fontWeight:700,fontSize:14,color:C.fg,fontFamily:"'JetBrains Mono',monospace"}}>
              <AnimNum value={couPoints}/>
            </span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:5,padding:'5px 10px',
            background:C.card,border:`2px solid ${C.border}`,boxShadow:`2px 2px 0 ${C.border}`,borderRadius:4}}>
            <GemIcon size={14} color={C.purple}/>
            <span style={{fontWeight:700,fontSize:14,color:C.fg,fontFamily:"'JetBrains Mono',monospace"}}>
              <AnimNum value={gems}/>
            </span>
          </div>
        </div>
      </div>

      {/* Wheel area */}
      <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',
        paddingBottom:196}}>

        {/* Player avatars above the wheel */}
        <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:14}}>
          {Array.from({length:players}).map((_,i)=>{
            const slot=slotType(i);
            return (
              <div key={i} onClick={()=>{if(slot==='empty')setFilledGuests(g=>g+1);}} style={{
                width:42,height:42,borderRadius:'50%',border:`2.5px solid ${C.border}`,

    '隱私政策': '本隱私政策說明 CouPro 如何收集、使用及保護您的個人資料。\n\n1. 資料收集\n我們收集您提供的資訊（如姓名、電子信箱）及使用服務時產生的資料（如優惠券記錄、位置資料）。\n\n2. 資料使用\n• 提供和改善服務\n• 發送優惠通知\n• 防範欺詐行為\n\n3. 隱私模式\n開啟隱私模式後，您的位置將不會顯示在 CouMap 上。\n\n4. 資料分享\n我們不會出售您的個人資料。僅在法律要求或獲得您同意的情況下分享資料。\n\n5. 資料保留\n您可以隨時申請刪除帳號及相關資料。\n\n如有疑問請聯繫 privacy@coupro.app',
  };
  return (
    <div style={{position:'absolute',inset:0,zIndex:160,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.5)'}} onClick={onClose}/>
      <div style={{position:'relative',background:C.bg,borderRadius:'16px 16px 0 0',
        border:`3px solid ${C.border}`,borderBottom:'none',padding:'20px 16px 0',
        animation:'nbModalIn 0.28s ease-out',boxShadow:`0 -6px 0 ${C.yellow}`,
        height:'72%',display:'flex',flexDirection:'column'}}>
        <div style={{width:40,height:5,background:C.border,borderRadius:2,margin:'0 auto 14px'}}/>
        <div style={{fontWeight:800,fontSize:18,marginBottom:14}}>{title}</div>
        <div style={{flex:1,overflowY:'auto',marginBottom:0}}>
          <div style={{fontSize:12,lineHeight:1.75,color:C.fg,whiteSpace:'pre-line',paddingBottom:24}}>
            {texts[title]||'（內容即將更新）'}
          </div>
        </div>
        <div style={{padding:'14px 0 32px',background:C.bg}}>
          <button onClick={onClose} style={{width:'100%',padding:'12px',background:C.fg,border:`2px solid ${C.border}`,
            boxShadow:sh(2),borderRadius:5,fontWeight:700,fontSize:13,color:'#fff'}}>關閉</button>
        </div>
      </div>
    </div>
  );
};

const SettingsScreen = ({nav, gems, couPoints}) => {
  const [obStep,       setObStep]       = React.useState(0);
  const [obActive,     setObActive]     = React.useState(false);
  const [profileName,  setProfileName]  = React.useState('CoKayne');
  const [profileEmail, setProfileEmail] = React.useState('duankayne@gmail.com');
  const [profilePhone, setProfilePhone] = React.useState('+886 912-345-678');
  const [emailVerified,setEmailVerified]= React.useState(true);
  const [phoneVerified,setPhoneVerified]= React.useState(false);
  const [showEdit,     setShowEdit]     = React.useState(false);
  const [showLogout,   setShowLogout]   = React.useState(false);
  const [showDelete,   setShowDelete]   = React.useState(false);
  const [showTerms,    setShowTerms]    = React.useState(false);
  const [showPrivacy,  setShowPrivacy]  = React.useState(false);
  const [feedbackType, setFeedbackType] = React.useState(null);
  const [showBlocked,  setShowBlocked]  = React.useState(false);
  const [verifyField,  setVerifyField]  = React.useState(null);

  const sec = (label) => (
    <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:'0.1em',
      textTransform:'uppercase',color:C.muted,marginBottom:8,marginTop:4}}>{label}</div>
  );
  const Row = ({label, sub, right, onClick}) => (
    <div onClick={onClick} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
      padding:'13px 14px',background:C.card,border:`2px solid ${C.border}`,
      boxShadow:sh(2),borderRadius:6,marginBottom:8,cursor:onClick?'pointer':'default'}}>
      <div>
        <div style={{fontWeight:600,fontSize:14,letterSpacing:'-0.01em'}}>{label}</div>
        {sub && <div style={{fontSize:11,color:C.muted,marginTop:2}}>{sub}</div>}
      </div>
      {right}
    </div>
  );
  const VerifiedBadge = ({ok}) => (
    <span style={{padding:'3px 8px',background:ok?C.green:C.subtle,border:`1.5px solid ${C.border}`,
      borderRadius:3,fontSize:10,fontWeight:700,color:ok?'#fff':C.muted,
      fontFamily:"'JetBrains Mono',monospace",flexShrink:0}}>
      {ok ? '✓ 已驗證' : '未驗證'}
    </span>
  );

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',position:'relative',overflow:'hidden'}}>
      <div style={{flex:1,overflowY:'auto',paddingBottom:16}}>
        <StatusBar/>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'2px 20px 14px'}}>
          <button onClick={()=>nav('home')} style={{width:34,height:34,background:C.card,
            border:`2px solid ${C.border}`,boxShadow:sh(2),borderRadius:4,
            display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,fontWeight:700}}>←</button>
          <span style={{fontSize:20,fontWeight:800,letterSpacing:'-0.03em'}}>設定</span>
          <div style={{marginLeft:'auto'}}>
            <HelpBtn onClick={()=>{setObStep(0);setObActive(true);}}/>
          </div>
        </div>

        {/* Profile card — no avatar */}
        <div style={{padding:'0 16px 16px'}}>
          <div style={{background:C.yellow,border:`2.5px solid ${C.border}`,boxShadow:sh(5),borderRadius:8,padding:'18px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
              <div style={{minWidth:0}}>
                <div style={{fontWeight:900,fontSize:20,letterSpacing:'-0.03em',color:C.fg}}>{profileName}</div>
                <div style={{fontSize:12,color:'rgba(51,51,51,0.65)',marginTop:2}}>{profileEmail}</div>
                <div style={{fontSize:12,color:'rgba(51,51,51,0.65)',marginTop:1}}>{profilePhone}</div>
              </div>
              <button onClick={()=>setShowEdit(true)} style={{padding:'8px 12px',background:C.fg,
                border:`2px solid ${C.border}`,boxShadow:sh(2),borderRadius:4,
                color:C.yellow,fontWeight:700,fontSize:12,flexShrink:0,marginLeft:10}}>編輯</button>
            </div>
            <div style={{display:'flex',gap:6}}>
              <span style={{padding:'2px 8px',background:C.fg,color:C.yellow,border:`1.5px solid ${C.border}`,
                borderRadius:3,fontSize:10,fontWeight:700,fontFamily:"'JetBrains Mono',monospace"}}>
                {couPoints} pt
              </span>
              <span style={{padding:'2px 8px',background:C.purpleLight,color:C.fg,border:`1.5px solid ${C.border}`,
                borderRadius:3,fontSize:10,fontWeight:700,fontFamily:"'JetBrains Mono',monospace"}}>
                {gems} 💎
              </span>
            </div>
          </div>
        </div>

        {/* Verification section */}
        <div style={{padding:'0 16px 8px'}}>
          {sec('帳號驗證')}
          <Row label="電子信箱驗證" sub={profileEmail}
            right={<div style={{display:'flex',alignItems:'center',gap:8}}>
              <VerifiedBadge ok={emailVerified}/>
              {!emailVerified&&<button onClick={()=>setVerifyField('email')} style={{padding:'4px 8px',
                background:C.yellow,border:`1.5px solid ${C.border}`,borderRadius:3,
                fontSize:11,fontWeight:700,color:C.fg}}>驗證</button>}
            </div>}
            onClick={emailVerified?undefined:()=>setVerifyField('email')}/>
          <Row label="手機號碼驗證" sub={profilePhone}
            right={<div style={{display:'flex',alignItems:'center',gap:8}}>
              <VerifiedBadge ok={phoneVerified}/>
              {!phoneVerified&&<button onClick={()=>setVerifyField('phone')} style={{padding:'4px 8px',
                background:C.yellow,border:`1.5px solid ${C.border}`,borderRadius:3,
                fontSize:11,fontWeight:700,color:C.fg}}>驗證</button>}
            </div>}
            onClick={phoneVerified?undefined:()=>setVerifyField('phone')}/>
        </div>

        {/* Feedback section */}
        <div style={{padding:'0 16px 8px'}}>
          {sec('回饋')}
          <Row label="🐞 回報問題" sub="透過信箱告訴我們你遇到的 Bug"
            right={<span style={{fontSize:16,color:C.muted}}>›</span>}
            onClick={()=>setFeedbackType('bug')}/>
          <Row label="💡 功能建議" sub="建議你希望看到的新功能"
            right={<span style={{fontSize:16,color:C.muted}}>›</span>}
            onClick={()=>setFeedbackType('feature')}/>
        </div>

        {/* Privacy / Data section */}
        <div style={{padding:'0 16px 8px'}}>
          {sec('隱私與資料')}
          <Row label="封鎖商家" sub="管理不想看到的商家"
            right={<span style={{fontSize:16,color:C.muted}}>›</span>}
            onClick={()=>setShowBlocked(true)}/>
          <Row label="刪除帳號" sub="永久刪除所有資料"
            right={<span style={{fontSize:16,color:C.red}}>›</span>}
            onClick={()=>setShowDelete(true)}/>
        </div>

        {/* About section */}
        <div style={{padding:'0 16px 16px'}}>
          {sec('關於')}
          <div style={{background:C.card,border:`2px solid ${C.border}`,boxShadow:sh(2),
            borderRadius:6,overflow:'hidden',marginBottom:8}}>
            {[['版本','v1.0.0-beta',null],['服務條款','閱讀',()=>setShowTerms(true)],['隱私政策','閱讀',()=>setShowPrivacy(true)]].map(([k,v,action],i,arr)=>(
              <div key={k} onClick={action||undefined} style={{display:'flex',justifyContent:'space-between',alignItems:'center',
                padding:'12px 14px',borderBottom:i<arr.length-1?`1.5px solid ${C.subtle}`:'none',cursor:action?'pointer':'default'}}>
                <span style={{fontSize:13,fontWeight:500}}>{k}</span>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,
                  color:action?C.purple:C.muted,fontWeight:action?700:400}}>{v}</span>
              </div>
            ))}
          </div>
          <button onClick={()=>setShowLogout(true)} style={{width:'100%',padding:'12px',background:C.red,
            border:`2px solid ${C.border}`,boxShadow:sh(3),borderRadius:6,
            color:'#fff',fontWeight:800,fontSize:14,letterSpacing:'-0.01em'}}>登出帳號</button>
        </div>
      </div>
      {obActive      && <OnboardingOverlay screenKey="settings" step={obStep} onNext={()=>setObStep(s=>s+1)} onDone={()=>setObActive(false)}/>}
      {showEdit      && <EditProfileModal  name={profileName} email={profileEmail} phone={profilePhone}
                          onSave={(n,e,p,nameChg,emailChg,phoneChg)=>{
                            setProfileName(n);setProfileEmail(e);setProfilePhone(p);
                            if(emailChg){setEmailVerified(false);setVerifyField('email');}
                            else if(phoneChg){setPhoneVerified(false);setVerifyField('phone');}
                          }}
                          onClose={()=>setShowEdit(false)}/>}
      {showLogout    && <LogoutConfirmModal onLogout={()=>{setShowLogout(false);nav('home');}} onClose={()=>setShowLogout(false)}/>}
      {showDelete    && <DeleteAccountModal onClose={()=>setShowDelete(false)}/>}
      {showTerms     && <LegalTextModal title="服務條款" onClose={()=>setShowTerms(false)}/>}
      {showPrivacy   && <LegalTextModal title="隱私政策" onClose={()=>setShowPrivacy(false)}/>}
      {feedbackType  && <FeedbackModal type={feedbackType} onClose={()=>setFeedbackType(null)}/>}
      {showBlocked   && <BlockedMerchantsModal onClose={()=>setShowBlocked(false)}/>}
      {verifyField   && <VerifyModal field={verifyField}
                          currentVal={verifyField==='email'?profileEmail:profilePhone}
                          onClose={()=>{if(verifyField==='email')setEmailVerified(true);else setPhoneVerified(true);setVerifyField(null);}}/>}
    </div>
  );
};

// ── App ────────────────────────────────────────────────────────────────────────
function App() {
  const [screen,    setScreen]    = React.useState('home');
  const [params,    setParams]    = React.useState({});
  const [gems,      setGems]      = React.useState(3);
  const [couPoints, setCouPoints] = React.useState(128);

  const nav = (s, p={}) => { setScreen(s); setParams(p); window.scrollTo&&window.scrollTo(0,0); };
  const sp  = {nav, gems, setGems, couPoints, setCouPoints};

  const screens = {
    home:          <HomeScreen         {...sp}/>,
    map:           <MapScreen          {...sp}/>,
    spinner:       <SpinnerScreen      {...sp}/>,
    settings:      <SettingsScreen     {...sp}/>,
    'coupon-detail':<CouponDetailScreen {...sp} params={params}/>,
    'coupon-qr':   <CouponUseQRScreen  {...sp} params={params}/>,
    'coupon-share':<CouponShareScreen  {...sp} params={params}/>,
  };

  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',
      minHeight:'100vh',background:'#1A1A1A',fontFamily:"'Space Grotesk', system-ui, sans-serif"}}>
      <div style={{width:390,height:844,background:C.bg,
        border:`3px solid ${C.border}`,borderRadius:50,overflow:'hidden',
        position:'relative',display:'flex',flexDirection:'column',
        boxShadow:`10px 10px 0 ${C.yellow}, 18px 18px 0 ${C.border}`}}>
        <div style={{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',
          width:124,height:36,background:C.fg,borderRadius:22,zIndex:100,pointerEvents:'none'}}/>
        {screens[screen] || screens.home}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
