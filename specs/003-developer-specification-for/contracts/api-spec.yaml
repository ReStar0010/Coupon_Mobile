openapi: 3.0.3
info:
  title: Coupon_Mobile API
  description: REST API for the Coupon_Mobile local business coupon sharing platform
  version: 1.0.0
  contact:
    name: Coupon_Mobile Development Team

servers:
  - url: http://localhost:8000/api
    description: Development server
  - url: https://api.couponmobile.app
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
        date_joined:
          type: string
          format: date-time

    StudentProfile:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        phone_number:
          type: string
          maxLength: 20
        verified:
          type: boolean
        coupons_used_count:
          type: integer
        total_savings:
          type: number
          format: decimal
        monthly_savings:
          type: number
          format: decimal
        savings_goal_name:
          type: string
          maxLength: 100
        savings_goal_amount:
          type: number
          format: decimal
        savings_goal_image:
          type: string
          maxLength: 200
        last_draw_time:
          type: string
          format: date-time
        last_logged_in:
          type: string
          format: date-time

    Store:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 100
        lat:
          type: number
          format: float
        lng:
          type: number
          format: float
        address:
          type: string
          maxLength: 200
        business_hours:
          type: string
        owner:
          type: integer

    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 50
        display_name:
          type: string
          maxLength: 50

    Coupon:
      type: object
      properties:
        id:
          type: integer
        store:
          $ref: '#/components/schemas/Store'
        coupon_name:
          type: string
          maxLength: 100
        coupon_detail:
          type: string
        important_notes:
          type: string
        start_date:
          type: string
          format: date-time
        expiry_date:
          type: string
          format: date-time
        image_url:
          type: string
          maxLength: 255
        coupon_type:
          type: string
          enum: [store, exclusive]
        estimated_savings:
          type: number
          format: decimal
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        current_holder:
          type: integer
        redeem_code:
          type: string
          maxLength: 6
        usage_per_day:
          type: string
          enum: [one-time, unlimited]

    CouponTemplate:
      type: object
      properties:
        id:
          type: integer
        store:
          $ref: '#/components/schemas/Store'
        coupon_name:
          type: string
          maxLength: 100
        coupon_detail:
          type: string
        important_notes:
          type: string
        image_url:
          type: string
          maxLength: 255
        estimated_savings:
          type: number
          format: decimal
        template_redeem_code:
          type: string
          maxLength: 6
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        total_quantity:
          type: integer
          minimum: 1
        remaining_quantity:
          type: integer
          minimum: 0
        start_date:
          type: string
          format: date-time
        expiry_date:
          type: string
          format: date-time
        draw_probability:
          type: number
          minimum: 0
          maximum: 1
        is_active:
          type: boolean

    CouponRedemption:
      type: object
      properties:
        id:
          type: integer
        coupon:
          $ref: '#/components/schemas/Coupon'
        user:
          $ref: '#/components/schemas/User'
        redeemed_at:
          type: string
          format: date-time
        savings_amount:
          type: number
          format: decimal

    CouponShareRequest:
      type: object
      properties:
        id:
          type: integer
        coupon:
          $ref: '#/components/schemas/Coupon'
        from_user:
          $ref: '#/components/schemas/User'
        to_user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [pending, accepted, declined]
        created_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time

    DailyDrawResult:
      type: object
      properties:
        success:
          type: boolean
        coupon:
          $ref: '#/components/schemas/Coupon'
        message:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
        code:
          type: string

security:
  - BearerAuth: []

paths:
  # Authentication Endpoints
  /auth/register/:
    post:
      tags: [Authentication]
      summary: Register new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirm:
                  type: string
                user_type:
                  type: string
                  enum: [student, merchant]
              required: [email, password, password_confirm, user_type]
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  access:
                    type: string
                  refresh:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login/:
    post:
      tags: [Authentication]
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  refresh:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh/:
    post:
      tags: [Authentication]
      summary: Refresh JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
              required: [refresh]
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string

  # User Profile Endpoints
  /profile/:
    get:
      tags: [User Profile]
      summary: Get current user profile
      responses:
        '200':
          description: User profile data
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StudentProfile'
                  - type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      phone:
                        type: string
                      contact_person:
                        type: string
                      contact_info:
                        type: string

    put:
      tags: [User Profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_number:
                  type: string
                savings_goal_name:
                  type: string
                savings_goal_amount:
                  type: number
                savings_goal_image:
                  type: string
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'

  # Store Endpoints
  /stores/:
    get:
      tags: [Stores]
      summary: List all stores
      security: []
      parameters:
        - name: lat
          in: query
          schema:
            type: number
          description: User latitude for proximity sorting
        - name: lng
          in: query
          schema:
            type: number
          description: User longitude for proximity sorting
        - name: radius
          in: query
          schema:
            type: number
          description: Search radius in kilometers
      responses:
        '200':
          description: List of stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Store'

    post:
      tags: [Stores]
      summary: Create new store (merchants only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
                address:
                  type: string
                business_hours:
                  type: string
              required: [name, lat, lng, address]
      responses:
        '201':
          description: Store created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'

  /stores/{id}/:
    get:
      tags: [Stores]
      summary: Get store details
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Store details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'

  # Coupon Endpoints
  /coupons/store/:
    get:
      tags: [Coupons]
      summary: Get available store coupons
      security: []
      parameters:
        - name: tags
          in: query
          schema:
            type: string
          description: Comma-separated tag names for filtering
        - name: search
          in: query
          schema:
            type: string
          description: Search in coupon name and details
      responses:
        '200':
          description: List of store coupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coupon'

  /coupons/my/:
    get:
      tags: [Coupons]
      summary: Get user's exclusive coupons
      responses:
        '200':
          description: User's exclusive coupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coupon'

  /coupons/{id}/redeem/:
    post:
      tags: [Coupons]
      summary: Redeem a coupon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redeem_code:
                  type: string
                  description: Required for exclusive coupons
                savings_amount:
                  type: number
                  format: decimal
                  description: Actual savings amount
      responses:
        '200':
          description: Coupon redeemed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponRedemption'
        '400':
          description: Invalid redemption attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Daily Draw Endpoints
  /daily-draw/templates/:
    get:
      tags: [Daily Draw]
      summary: Get available daily draw templates
      responses:
        '200':
          description: Available draw templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CouponTemplate'

  /daily-draw/{template_id}/draw/:
    post:
      tags: [Daily Draw]
      summary: Participate in daily draw
      parameters:
        - name: template_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Draw result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyDrawResult'
        '400':
          description: Draw not allowed (already drawn today, template inactive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Sharing Endpoints
  /coupons/{id}/share/:
    post:
      tags: [Sharing]
      summary: Create coupon share request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to_user_email:
                  type: string
                  format: email
              required: [to_user_email]
      responses:
        '201':
          description: Share request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponShareRequest'

  /share-requests/:
    get:
      tags: [Sharing]
      summary: Get user's share requests (sent and received)
      responses:
        '200':
          description: Share requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: array
                    items:
                      $ref: '#/components/schemas/CouponShareRequest'
                  received:
                    type: array
                    items:
                      $ref: '#/components/schemas/CouponShareRequest'

  /share-requests/{token}/respond/:
    post:
      tags: [Sharing]
      summary: Respond to share request
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [accept, decline]
              required: [action]
      responses:
        '200':
          description: Response processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponShareRequest'

  # Statistics Endpoints
  /statistics/:
    get:
      tags: [Statistics]
      summary: Get user statistics
      responses:
        '200':
          description: User statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  coupons_used_count:
                    type: integer
                  total_savings:
                    type: number
                  monthly_savings:
                    type: number
                  savings_goal:
                    type: object
                    properties:
                      name:
                        type: string
                      amount:
                        type: number
                      image:
                        type: string
                      progress:
                        type: number
                  completed_goals:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        amount:
                          type: number
                        image:
                          type: string
                        completed_date:
                          type: string
                          format: date-time

  /statistics/redemption-history/:
    get:
      tags: [Statistics]
      summary: Get user's redemption history
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: page_size
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Redemption history
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type: string
                  previous:
                    type: string
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/CouponRedemption'

tags:
  - name: Authentication
    description: User registration, login, and token management
  - name: User Profile
    description: User profile management
  - name: Stores
    description: Store location management
  - name: Coupons
    description: Coupon browsing and redemption
  - name: Daily Draw
    description: Daily draw participation
  - name: Sharing
    description: Peer-to-peer coupon sharing
  - name: Statistics
    description: User statistics and history