# Phone-Based Forgot Password API Contract
# Feature: 009-phone-registration

openapi: 3.0.3
info:
  title: Phone-Based Password Reset Endpoints
  version: 1.0.0

paths:
  /api/forgot-password/phone/send-otp/:
    post:
      summary: Send password reset OTP via phone
      description: |
        Sends an SMS OTP for password reset to a registered phone number.
        Returns error if the phone is not registered to any account.
        AllowAny permission (unauthenticated).
        Rate limited: max 3 per hour per phone, 60s cooldown.
      operationId: sendPasswordResetOTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number]
              properties:
                phone_number:
                  type: string
                  pattern: '^09\d{8}$'
                  example: "0912345678"
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "驗證碼已發送"
                  cooldown_seconds:
                    type: integer
                    example: 60
                  expires_in_seconds:
                    type: integer
                    example: 600
                  dev_mode:
                    type: boolean
                  otp_code:
                    type: string
                    description: Only in dev mode
        '400':
          description: Invalid phone format
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Phone number not registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "此手機號碼未註冊"
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  retry_after_seconds:
                    type: integer

  /api/forgot-password/phone/reset/:
    post:
      summary: Reset password with phone OTP
      description: |
        Verifies the OTP and resets the user's password.
        AllowAny permission (unauthenticated).
      operationId: resetPasswordWithOTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, otp_code, new_password]
              properties:
                phone_number:
                  type: string
                  pattern: '^09\d{8}$'
                  example: "0912345678"
                otp_code:
                  type: string
                  pattern: '^\d{6}$'
                  example: "123456"
                new_password:
                  type: string
                  minLength: 6
                  example: "newpassword123"
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "密碼已重設成功"
        '400':
          description: Invalid OTP or validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  attempts_remaining:
                    type: integer
        '404':
          description: No pending OTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '410':
          description: OTP expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
