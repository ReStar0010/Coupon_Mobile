name: Consumer app - EAS Update

on:
  push:
    branches: [main]
    paths: [Mobile-Frontend/**]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile-Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Mobile-Frontend/package-lock.json

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Commit message via env var (injection-safe; see dev workflow note).
      - name: Publish production OTA update
        run: eas update --branch production --message "$EAS_MESSAGE"
        env:
          EAS_MESSAGE: ${{ github.event.head_commit.message || format('manual dispatch ({0})', github.sha) }}
