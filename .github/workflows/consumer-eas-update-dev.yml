name: Consumer app - EAS Update (Dev)

on:
  push:
    branches: [dev]
    paths: [Mobile-Frontend/**]
  # Allow manual re-publish (e.g. after a CI fix) without a code change.
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile-Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Mobile-Frontend/package-lock.json

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Pass the commit message via an env var, NOT inline `${{ }}` in the
      # shell — a multi-line message or one with $/"/+ chars otherwise breaks
      # the command (and is a script-injection vector). Falls back to the SHA
      # on manual dispatch (no head_commit).

      # CouPro Dev (development channel) → prod backend. No EXPO_PUBLIC_API_URL
      # is set, so the bundle uses client.ts's prod fallback URL.
      - name: Publish dev OTA update (CouPro Dev → prod backend)
        run: eas update --branch development --message "$EAS_MESSAGE"
        env:
          EAS_MESSAGE: ${{ github.event.head_commit.message || format('manual dispatch ({0})', github.sha) }}

      # CouPro Prev (preview channel) → dev backend. Same dev-branch FE bits as
      # above, but EXPO_PUBLIC_API_URL is inlined at export time so the OTA
      # bundle talks to the dev backend instead of prod.
      - name: Publish preview OTA update (CouPro Prev → dev backend)
        run: eas update --branch preview --message "$EAS_MESSAGE"
        env:
          EAS_MESSAGE: ${{ github.event.head_commit.message || format('manual dispatch ({0})', github.sha) }}
          EXPO_PUBLIC_API_URL: https://coupon-mobile-dev.onrender.com
