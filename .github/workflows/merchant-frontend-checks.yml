name: Merchant frontend checks

on:
  pull_request:
    paths:
      - Mobile-Merchant-Frontend/**
      - .github/workflows/merchant-frontend-checks.yml
  push:
    branches: [main]
    paths: [Mobile-Merchant-Frontend/**]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile-Merchant-Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Mobile-Merchant-Frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit
