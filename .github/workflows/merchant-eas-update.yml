name: Merchant app - EAS Update

on:
  push:
    branches: [main]
    paths: [Mobile-Merchant-Frontend/**]

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile-Merchant-Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Mobile-Merchant-Frontend/package-lock.json

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: eas update --branch production --message "${{ github.event.head_commit.message }} --environment production"
