{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<h1>{{ title }}</h1>
<p>將 <strong>{{ eligible_count }}</strong> 張平台券指派給以下使用者：</p>
<form method="post">
  {% csrf_token %}
  <table>
    {{ form.as_table }}
  </table>
  <input type="submit" value="確認指派">
  <a href="{% url 'admin:api_platformvoucher_changelist' %}">取消</a>
</form>
{% endblock %}
