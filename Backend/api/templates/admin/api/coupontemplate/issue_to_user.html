{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<h1>發給指定使用者</h1>
<p>選擇優惠券範本與指定使用者，系統會依範本建立優惠券並發給該使用者（<code>acquisition_method</code> 為「後台發放」）。</p>
<form method="post">
  {% csrf_token %}
  <table>
    {{ form.as_table }}
  </table>
  <input type="submit" value="建立並發放">
  <a href="{% url 'admin:api_coupontemplate_changelist' %}">取消</a>
</form>
{% endblock %}
