{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<h1>{{ title }}</h1>
<p>目前餘額: <strong>{{ wallet.gems }}</strong> CouGems, <strong>{{ wallet.cou_points }}</strong> CouPoints</p>
<form method="post">
  {% csrf_token %}
  <table>
    {{ form.as_table }}
  </table>
  <br>
  <input type="submit" value="確認調整">
  <a href="{% url 'admin:api_wallet_change' wallet.pk %}">取消</a>
</form>
{% endblock %}
