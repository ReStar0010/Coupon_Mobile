<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  {% if app_store_id %}
  <meta name="apple-itunes-app" content="app-id={{ app_store_id }}, app-argument={{ page_url }}">
  {% endif %}
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ page_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CouPro">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #fff8e7 0%, #fff 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #333;
    }
    .card {
      max-width: 360px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      padding: 32px 24px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #1a1a1a; }
    p { font-size: 0.95rem; color: #666; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      margin: 8px 0;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.9; }
    .btn-primary { background: #FFAD31; color: #333; }
    .links { margin-top: 20px; }
    .links a { color: #6366f1; font-size: 0.9rem; }
  </style>
</head>
<body>
  {% include '_landing_open_ext_redirect.html' %}
  <div class="card">
    <h1>CouPro 優惠券</h1>
    <p>{{ description }}</p>
    <button id="open-app" class="btn btn-primary">在 App 中開啟</button>
    <div class="links">
      {% if app_store_id %}
      <a href="{{ app_store_url }}" id="link-ios">從 App Store 下載</a>
      <br>
      {% endif %}
      <a href="{{ play_store_url }}" id="link-android">從 Google Play 下載</a>
    </div>
  </div>
  {% include '_landing_open_app_script.html' %}
</body>
</html>
